  # ── MySQL 8.0 ────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: freightflex_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: freightflex
      MYSQL_USER: freightflex_user
      MYSQL_PASSWORD: freightflex_pass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "freightflex_user", "-pfreightflex_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - freightflex_network
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password

  # ── Redis 7 ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: freightflex_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - freightflex_network
    command: redis-server --appendonly yes

  # ── Celery Worker ─────────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freightflex_celery
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - DB_HOST=mysql
      - REDIS_HOST=redis
    volumes:
      - .:/app
    depends_on:
      - mysql
      - redis
    networks:
      - freightflex_network
    command: celery -A app.tasks.celery_app worker --loglevel=info

  # ── Celery Flower (Monitor) ───────────────────────────────────────────────────
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freightflex_flower
    restart: unless-stopped
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      - redis
      - celery_worker
    networks:
      - freightflex_network
    command: celery -A app.tasks.celery_app flower --port=5555

